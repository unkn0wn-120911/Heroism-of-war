name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: 4.7.2
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command line tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd /tmp
          curl -L -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q -o cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"

          if [ -d "$ANDROID_HOME/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"

      - name: Install Godot 4 editor
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /opt/godot
          cd /tmp
          curl -L -o godot-editor.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o godot-editor.zip -d /opt/godot
          chmod +x "/opt/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          export TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_ROOT"

          cd /tmp
          curl -L -o export_templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -o export_templates.tpz -d "$TEMPLATE_ROOT"

          ln -sf "$TEMPLATE_ROOT/templates/android_debug.apk" "$TEMPLATE_ROOT/android_debug.apk"
          ln -sf "$TEMPLATE_ROOT/templates/android_release.apk" "$TEMPLATE_ROOT/android_release.apk"
          ln -sf "$TEMPLATE_ROOT/templates/android_source.zip" "$TEMPLATE_ROOT/android_source.zip"

      - name: Generate Android debug keystore
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p android
          keytool -genkey -v \
            -keystore android/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Heroism of War, OU=GameDev, O=Heroism of War, L=Remote, S=NA, C=US"

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          /opt/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
            --headless \
            --path . \
            --export-debug "Android" \
            build/HeroismOfWar-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeroismOfWar-Android-Debug
          path: build/HeroismOfWar-debug.apk
          if-no-files-found: error
